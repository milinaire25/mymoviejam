<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spider-Man 2002 review artwork</title>
  <desc id="desc">Red and blue MyMovieJam review card for Spider-Man 2002 with a 9.1 out of 10 rating and an easy yes verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12090a"/>
      <stop offset="48%" stop-color="#56121a"/>
      <stop offset="100%" stop-color="#0d2a63"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="web" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M70 0 L70 140 M0 70 L140 70 M10 10 Q70 40 130 10 M10 130 Q70 100 130 130 M10 10 Q40 70 10 130 M130 10 Q100 70 130 130" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" rx="48"/>
  <rect width="1600" height="900" fill="url(#web)" rx="48"/>
  <rect x="72" y="72" width="1456" height="756" rx="36" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="118" y="176" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">MYMOVIEJAM REVIEW</text>
  <text x="118" y="314" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="900">SPIDER-MAN</text>
  <text x="118" y="382" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">(2002)</text>
  <rect x="118" y="432" width="560" height="8" rx="4" fill="url(#line)"/>
  <text x="118" y="520" fill="#fecaca" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Heart first. Villain huge. Still works.</text>
  <text x="118" y="602" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Tobey Maguire, Raimi energy, and one of the easiest superhero yeses.</text>
  <rect x="1110" y="148" width="312" height="312" rx="38" fill="rgba(255,255,255,0.08)"/>
  <text x="1266" y="264" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">MYMOVIEJAM</text>
  <text x="1266" y="360" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="122" font-weight="900">9.1</text>
  <text x="1266" y="414" text-anchor="middle" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">OUT OF 10 · EASY YES</text>
  <text x="118" y="758" fill="#d1d5db" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">superhero movie review · audience-first verdict · no fake hype</text>
</svg>
